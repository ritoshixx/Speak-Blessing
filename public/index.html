<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a1a">
<title>LAN Talk</title>
<style>
:root{--bg:#0e1a1a;--sf:#162726;--ln:#2a4543;--tx:#e8efe4;--dim:#93aca4;--on:#f4c430;--rx:#5fe3a8;--bad:#ff7a6e;
--disp:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Roboto Condensed",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
main{max-width:30rem;margin:0 auto;min-height:100vh;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1rem}
h1{font:700 2.8rem/1 var(--disp);margin:2.5rem 0 .2rem}
.sub{margin:0 0 .5rem;color:var(--dim)}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:.8rem .9rem}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:.8rem 1rem}
:focus-visible{outline:2px solid var(--rx);outline-offset:2px}
.primary{background:var(--on);color:#1a1500;border-color:var(--on);font-weight:700}
.row{display:flex;gap:.6rem;align-items:center}.row>*{flex:1}
label.f{display:grid;gap:.3rem;color:var(--dim);font-size:.9rem}
.or{text-align:center;color:var(--dim);font-size:.9rem}
#code{letter-spacing:.35em;text-align:center;font:700 1.4rem var(--disp)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.code{display:flex;gap:.35rem}
.code b{font:700 2rem/1 var(--disp);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:.5rem .6rem}
.top button{flex:none;padding:.6rem .8rem}
#qrbox{background:#fff;border-radius:12px;padding:.6rem;text-align:center;color:#111}
#qrbox img{width:min(60vw,14rem);height:auto;display:block;margin:0 auto}
#qrbox small{display:block;word-break:break-all}
#members{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
#members li{display:flex;align-items:center;gap:.6rem;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:.55rem .8rem}
#members .st{margin-left:auto;color:var(--dim);font-size:.85rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--ln);flex:none}
li.talking{border-color:var(--rx)}li.talking .dot{background:var(--rx);border-color:var(--rx);box-shadow:0 0 0 4px #5fe3a844}li.talking .st{color:var(--rx)}
li.me .dot{background:var(--dim);border-color:var(--dim)}li.me.talking .dot{background:var(--on);border-color:var(--on);box-shadow:0 0 0 4px #f4c43044}li.me.talking{border-color:var(--on)}li.me.talking .st{color:var(--on)}
li.wait .dot{border-color:var(--on)}
.cnt{color:var(--dim);font-size:.9rem;margin:0 0 .4rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--ln);border-radius:10px;padding:2px}
.seg button{border:0;border-radius:8px;background:var(--bg);color:var(--dim);padding:.6rem .3rem}
.seg button[aria-pressed=true]{background:var(--rx);color:#06241a;font-weight:700}
.ptt{align-self:center;width:min(62vw,16rem);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--sf);
box-shadow:inset 0 0 0 2px var(--ln),0 0 0 8px var(--bg),0 0 0 10px var(--ln);font:700 1.6rem var(--disp);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:.4rem 0}
.ptt small{display:block;font:400 .85rem system-ui;color:var(--dim);margin-top:.2rem}
.ptt.tx{background:var(--on);color:#1a1500;box-shadow:0 0 0 8px var(--bg),0 0 0 11px var(--on),0 0 36px 12px #f4c43055}
.ptt.tx small{color:#4a3d00}
.ptt.muted{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.ptt{transition:box-shadow .08s,background .08s}}
#lvl{height:6px;background:var(--sf);border-radius:3px;overflow:hidden}
#lvl i{display:block;height:100%;background:var(--rx);transform-origin:left;transform:scaleX(0)}
details{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:.7rem .9rem}
details[open] summary{margin-bottom:.7rem}details>*:not(summary){margin-top:.6rem}
.note{color:var(--dim);font-size:.85rem;margin:0}
#toast{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:.7rem 1rem;border-radius:10px;max-width:90vw;font-size:.95rem;box-shadow:0 4px 20px #0008}
</style>
</head>
<body>
<main>
<section id="join">
  <h1>LAN Talk</h1>
  <p class="sub">Voice rooms for people on the same Wi-Fi or hotspot.</p>
  <div style="display:grid;gap:.9rem">
    <label class="f">Your name<input id="name" maxlength="20" autocomplete="nickname" placeholder="Guest"></label>
    <button class="primary" id="create">Create a room</button>
    <div class="or">or join with a code</div>
    <div class="row"><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" aria-label="4-digit room code"><button id="joinBtn">Join room</button></div>
  </div>
</section>

<section id="roomView" hidden style="display:flex;flex-direction:column;gap:1rem">
  <div class="top">
    <div class="code" id="codeTiles" aria-label="Room code"></div>
    <div class="row" style="flex:none"><button id="qrBtn" aria-expanded="false">QR code</button><button id="leave">Leave</button></div>
  </div>
  <div id="qrbox" hidden><img id="qr" alt="QR code to join this room"><small id="url"></small></div>

  <div><p class="cnt" id="count"></p><ul id="members"></ul></div>

  <div class="seg" id="talkMode" role="group" aria-label="Talk mode">
    <button data-v="ptt" aria-pressed="true">Push to talk</button><button data-v="free" aria-pressed="false">Hands-free</button>
  </div>

  <button class="ptt" id="ptt"><span id="pttLabel">Hold to talk</span><small id="pttHint">or hold Space</small></button>
  <div id="lvl" aria-hidden="true"><i></i></div>

  <div class="seg" id="route" role="group" aria-label="Audio route">
    <button data-v="speaker" aria-pressed="true">Speaker</button><button data-v="headset" aria-pressed="false">Headset</button><button data-v="bluetooth" aria-pressed="false">Bluetooth</button>
  </div>

  <details>
    <summary>Audio settings</summary>
    <label class="f">Microphone<select id="inSel"></select></label>
    <label class="f" id="outWrap">Output<select id="outSel"></select></label>
    <p class="note" id="outNote" hidden>This browser can't pick an output. Sound follows your phone's current route.</p>
    <label class="f">Hands-free noise gate (higher blocks more background noise)<input type="range" id="gate" min="3" max="60" value="12"></label>
  </details>
</section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const $ = s => document.querySelector(s);
const MODES = { speaker: { aec: true }, headset: { aec: false }, bluetooth: { aec: true } };
const MAX = 10; let iceServers = [], retry = null;
let ws, me, room, myName, stream, track, ac, src, an, buf;
let talkMode = 'ptt', route = 'speaker', txOn = false, muted = false, hang = 0, toastT;
const peers = new Map();
const sinkOK = 'setSinkId' in HTMLMediaElement.prototype;

try { $('#name').value = localStorage.getItem('lt-name') || ''; } catch {}
const q = new URLSearchParams(location.search).get('room');
if (q) $('#code').value = q.replace(/\D/g, '').slice(0, 4);

function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 4500); }
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
const sig = (to, data) => send({ type: 'signal', to, data });

// ---------- microphone ----------
async function startMic() {
  const c = {
    echoCancellation: MODES[route].aec, noiseSuppression: true, autoGainControl: true,
    voiceIsolation: true, channelCount: 1, sampleRate: 48000, latency: 0,
  };
  if ($('#inSel').value) c.deviceId = { exact: $('#inSel').value };
  const ns = await navigator.mediaDevices.getUserMedia({ audio: c });
  const old = stream;
  stream = ns; track = ns.getAudioTracks()[0]; track.enabled = txOn;
  peers.forEach(p => p.pc && p.pc.getSenders().forEach(s => s.replaceTrack(track)));
  old && old.getTracks().forEach(t => t.stop());
  ac = ac || new AudioContext({ latencyHint: 'interactive' });
  ac.resume();
  src && src.disconnect();
  src = ac.createMediaStreamSource(stream);
  an = ac.createAnalyser(); an.fftSize = 512; buf = new Float32Array(512);
  src.connect(an);
}

// Level meter + hands-free noise gate (opens on voice, holds 450 ms so words aren't clipped)
setInterval(() => {
  if (!an) return;
  an.getFloatTimeDomainData(buf);
  let s = 0; for (const v of buf) s += v * v;
  const r = Math.sqrt(s / buf.length);
  $('#lvl i').style.transform = `scaleX(${Math.min(1, r * 6)})`;
  if (talkMode === 'free' && !muted && room) {
    const now = performance.now();
    if (r > $('#gate').value / 1000) hang = now + 450;
    setTx(now < hang);
  }
}, 30);

// ---------- devices / route ----------
async function refreshDevices() {
  const list = await navigator.mediaDevices.enumerateDevices();
  const fill = (sel, kind) => {
    const keep = sel.value; sel.replaceChildren(new Option('Default', ''));
    list.filter(d => d.kind === kind && d.deviceId !== 'default' && d.deviceId !== 'communications')
      .forEach(d => sel.add(new Option(d.label || kind, d.deviceId)));
    sel.value = [...sel.options].some(o => o.value === keep) ? keep : '';
  };
  fill($('#inSel'), 'audioinput'); fill($('#outSel'), 'audiooutput');
  $('#outWrap').hidden = !sinkOK; $('#outNote').hidden = sinkOK;
}
const pick = (sel, re) => { const o = [...sel.options].find(o => o.value && re.test(o.text)); if (o) sel.value = o.value; return !!o; };

async function setRoute(r) {
  route = r;
  document.querySelectorAll('#route button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === r));
  await refreshDevices();
  $('#inSel').value = ''; $('#outSel').value = '';
  if (r === 'speaker') pick($('#outSel'), /speaker/i);
  else {
    const re = r === 'bluetooth' ? /bluetooth|airpods|buds|hands-?free/i : /headset|headphone|wired|usb|earphone/i;
    const a = pick($('#inSel'), re), b = pick($('#outSel'), re);
    if (!a && !b) toast(r === 'bluetooth'
      ? 'No Bluetooth audio device found. Pair one in system settings, then tap Bluetooth again.'
      : 'No headset detected. Using the default device.');
  }
  try { await startMic(); } catch { toast('Could not switch microphone.'); }
  applySinks();
  if (r === 'bluetooth') toast('Bluetooth adds roughly 100–200 ms of delay. A wired headset is faster.');
}
function applySinks() { if (sinkOK) peers.forEach(p => p.audio && p.audio.setSinkId($('#outSel').value || '').catch(() => {})); }

// ---------- WebRTC mesh ----------
const tune = sdp => sdp.replace(/(a=fmtp:\d+ [^\r\n]*useinbandfec=1[^\r\n]*)/, '$1;maxaveragebitrate=32000;usedtx=1');

function mk(p) {
  const pc = p.pc = new RTCPeerConnection({ iceServers, bundlePolicy: 'max-bundle' });
  pc.onicecandidate = e => e.candidate && sig(p.id, { ice: e.candidate });
  pc.ontrack = e => {
    try { e.receiver.jitterBufferTarget = 0; e.receiver.playoutDelayHint = 0; } catch {}
    const a = p.audio = document.createElement('audio');
    a.autoplay = true; a.playsInline = true; a.srcObject = e.streams[0];
    document.body.append(a); applySinks();
  };
  pc.onconnectionstatechange = () => { p.state = pc.connectionState; renderList(); if (p.state === 'failed') toast(`Lost connection to ${p.name}`); };
  return pc;
}
async function initiate(p) {
  const pc = mk(p);
  pc.addTrack(track, stream);
  const o = await pc.createOffer();
  await pc.setLocalDescription({ type: 'offer', sdp: tune(o.sdp) });
  sig(p.id, { sdp: pc.localDescription });
}
async function onSignal(from, d) {
  const p = peers.get(from); if (!p) return;
  const pc = p.pc || mk(p);
  if (d.sdp) {
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer') {
      pc.addTrack(track, stream);
      const a = await pc.createAnswer();
      await pc.setLocalDescription({ type: 'answer', sdp: tune(a.sdp) });
      sig(from, { sdp: pc.localDescription });
    }
    (p.q || []).splice(0).forEach(c => pc.addIceCandidate(c).catch(() => {}));
  } else if (d.ice) {
    if (pc.remoteDescription) pc.addIceCandidate(d.ice).catch(() => {}); else (p.q = p.q || []).push(d.ice);
  }
}
const addPeer = (id, name) => { const p = { id, name, talking: false, state: 'connecting' }; peers.set(id, p); return p; };
function dropPeer(id) { const p = peers.get(id); if (!p) return; p.pc && p.pc.close(); p.audio && p.audio.remove(); peers.delete(id); }

async function onMsg(e) {
  const m = JSON.parse(e.data);
  if (m.type === 'error') { if (m.code === 'taken' && retry && retry()) return; toast(m.msg); leave(); }
  else if (m.type === 'joined') {
    me = m.id; room = m.room; showRoom();
    for (const x of m.peers) await initiate(addPeer(x.id, x.name));
    renderList();
  }
  else if (m.type === 'peer-joined') { addPeer(m.id, m.name); renderList(); toast(`${m.name} joined`); }
  else if (m.type === 'peer-left') { const p = peers.get(m.id); p && toast(`${p.name} left`); dropPeer(m.id); renderList(); }
  else if (m.type === 'signal') onSignal(m.from, m.data).catch(() => {});
  else if (m.type === 'talking') { const p = peers.get(m.id); if (p) { p.talking = m.on; renderList(); } }
}

// ---------- UI ----------
function renderList() {
  const ul = $('#members'); ul.replaceChildren();
  const rows = [{ name: myName + ' (you)', talking: txOn, state: 'connected', me: true }, ...peers.values()];
  rows.forEach(r => {
    const li = document.createElement('li');
    li.className = [r.talking && 'talking', r.me && 'me', r.state !== 'connected' && 'wait'].filter(Boolean).join(' ');
    const d = Object.assign(document.createElement('span'), { className: 'dot' });
    const n = Object.assign(document.createElement('span'), { textContent: r.name });
    const s = Object.assign(document.createElement('span'), { className: 'st', textContent: r.talking ? 'talking' : r.state === 'connected' ? '' : 'connecting' });
    li.append(d, n, s); ul.append(li);
  });
  $('#count').textContent = `${rows.length} of ${MAX} in room`;
}
function ui() {
  const b = $('#ptt');
  b.classList.toggle('tx', txOn); b.classList.toggle('muted', talkMode === 'free' && muted);
  if (talkMode === 'ptt') { $('#pttLabel').textContent = txOn ? 'Talking' : 'Hold to talk'; $('#pttHint').textContent = 'or hold Space'; }
  else { $('#pttLabel').textContent = muted ? 'Muted' : txOn ? 'Talking' : 'Listening'; $('#pttHint').textContent = muted ? 'Tap to unmute' : 'Tap to mute'; }
}
function setTx(on) {
  if (talkMode === 'free' && muted) on = false;
  if (on === txOn) return;
  txOn = on; if (track) track.enabled = on;
  send({ type: 'talking', on }); ui(); renderList();
}
function setTalkMode(m) {
  talkMode = m; muted = false; setTx(false);
  document.querySelectorAll('#talkMode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === m));
  ui();
}
function showRoom() {
  $('#join').hidden = true; $('#roomView').hidden = false;
  $('#codeTiles').replaceChildren(...[...room].map(c => Object.assign(document.createElement('b'), { textContent: c })));
  const url = `${location.origin}/?room=${room}`;
  $('#qr').src = '/qr?text=' + encodeURIComponent(url); $('#url').textContent = url;
  refreshDevices().catch(() => {}); ui(); renderList();
  navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
}
function leave() {
  room = null; retry = null; ws && ws.close(); ws = null;
  [...peers.keys()].forEach(dropPeer);
  stream && stream.getTracks().forEach(t => t.stop());
  stream = track = an = null; txOn = false; muted = false;
  $('#join').hidden = false; $('#roomView').hidden = true; $('#qrbox').hidden = true;
}

async function enter(kind) {
  myName = ($('#name').value.trim() || 'Guest').slice(0, 20);
  try { localStorage.setItem('lt-name', myName); } catch {}
  const code = $('#code').value.trim();
  if (kind === 'join' && !/^\d{4}$/.test(code)) return toast('Enter the 4-digit room code.');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return toast('The microphone needs a secure page. Open the https:// link and accept the certificate warning.');
  try { await startMic(); } catch { return toast('Microphone blocked. Allow it in your browser, then try again.'); }
  iceServers = await fetch('/ice').then(r => r.json()).catch(() => [{ urls: 'stun:stun.cloudflare.com:3478' }]);
  const open = c => {
    ws = new WebSocket(`wss://${location.host}/ws?room=${c}`);
    ws.onopen = () => send({ type: kind, name: myName });
    ws.onmessage = onMsg;
    ws.onerror = () => toast('Cannot reach the server.');
    ws.onclose = () => { if (room) { toast('Connection to the server was lost.'); leave(); } };
  };
  const rnd = () => String(Math.floor(1000 + Math.random() * 9000));
  let tries = 0;
  retry = kind === 'create' ? () => { if (++tries > 8) return false; const o = ws; ws = null; o.close(); open(rnd()); return true; } : null;
  open(kind === 'create' ? rnd() : code);
}

$('#create').onclick = () => enter('create');
$('#joinBtn').onclick = () => enter('join');
$('#leave').onclick = leave;
$('#qrBtn').onclick = e => { const h = $('#qrbox').hidden = !$('#qrbox').hidden; e.target.setAttribute('aria-expanded', !h); };
$('#talkMode').onclick = e => e.target.dataset.v && setTalkMode(e.target.dataset.v);
$('#route').onclick = e => e.target.dataset.v && setRoute(e.target.dataset.v);
$('#inSel').onchange = () => startMic().catch(() => toast('Could not use that microphone.'));
$('#outSel').onchange = applySinks;
navigator.mediaDevices && (navigator.mediaDevices.ondevicechange = () => room && refreshDevices().catch(() => {}));

const ptt = $('#ptt');
ptt.onpointerdown = e => { ptt.setPointerCapture(e.pointerId); if (talkMode === 'ptt') setTx(true); };
ptt.onpointerup = () => { if (talkMode === 'ptt') setTx(false); else { muted = !muted; if (muted) setTx(false); ui(); } };
ptt.onpointercancel = () => talkMode === 'ptt' && setTx(false);
ptt.oncontextmenu = e => e.preventDefault();
const typing = e => /INPUT|SELECT|BUTTON/.test(e.target.tagName) && e.target !== ptt;
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && room && talkMode === 'ptt' && !typing(e)) { e.preventDefault(); setTx(true); } });
addEventListener('keyup', e => { if (e.code === 'Space' && room && talkMode === 'ptt' && !typing(e)) setTx(false); });
</script>
</body>
</html>
